services:
  database:
    image: postgres:16-alpine
    container_name: agilepm-db
    environment:
      POSTGRES_DB: agilepm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agilepm"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: agilepm-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@database:5432/agilepm?schema=public
      JWT_EXPIRES_IN: 15m
      CLIENT_URL: http://localhost:8080
      CLIENT_URLS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 150
      COOKIE_SECURE: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: agilepm-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
