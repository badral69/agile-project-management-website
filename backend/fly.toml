app = "sprintflow-api-badralmunh"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.fly"

[deploy]
  release_command = "sh -c 'npx prisma db push --accept-data-loss && node dist/prisma/seed.js'"

[env]
  PORT = "5000"
  NODE_ENV = "production"
  JWT_EXPIRES_IN = "7d"
  RATE_LIMIT_WINDOW_MS = "900000"
  RATE_LIMIT_MAX = "600"
  COOKIE_SECURE = "true"
  CLIENT_URL = "https://sprintflow-web-badralmunh.fly.dev"
  CLIENT_URLS = "https://sprintflow-web-badralmunh.fly.dev"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
